{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Registrar Peça</title>
    <link rel="stylesheet" href="{% static 'manutencao/style.css' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        form {
            max-width: 400px;
            margin: 0 auto 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .resultado {
            max-width: 400px;
            margin: 0 auto;
            background: #e9ecef;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 0 6px rgba(0,0,0,0.1);
        }
        .resultado h2 {
            margin-top: 0;
            text-align: center;
        }
        .resultado p {
            font-size: 1.1em;
            margin: 8px 0;
        }
    </style>
<head>
    <meta charset="UTF-8">
    <title>Registrar Nova Troca de Peça</title>
    <style>
        label { display: block; margin-top: 10px; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Registrar Nova Troca de Peça</h1>

    <form method="post" novalidate>
    {% csrf_token %}

    <label for="id_peca">Peça:</label>
    {{ form.peca }}

    <label for="data_troca">Data da troca:</label>
    <input type="text"
           name="data_troca"
           id="data_troca"
           class="form-control"
           placeholder="dd/mm/aaaa"
           required>

    <label for="data_quebra">Data da quebra:</label>
    <input type="text"
           name="data_quebra"
           id="data_quebra"
           class="form-control"
           placeholder="dd/mm/aaaa"
           required>

    <label for="id_tempo_uso_diario">Horas de uso por dia (0 – 24):</label>
    <input type="number" step="0.1" min="0" max="24"
           name="tempo_uso_diario"
           id="id_tempo_uso_diario"
           class="form-control"
           required
           oninput="validarHoras()">

    <label for="id_tipo_manutencao">Tipo de manutenção:</label>
    {{ form.tipo_manutencao }}

    <button type="submit">Enviar</button>
</form>

<!-- =Máscara para datas DD/MM/AAAA -->
<script>
function aplicarMascaraData(input) {
    input.addEventListener('input', () => {
        let v = input.value.replace(/\D/g, '');      
        if (v.length > 2)  v = v.slice(0, 2) + '/' + v.slice(2);
        if (v.length > 5)  v = v.slice(0, 5) + '/' + v.slice(5, 9);
        if (v.length > 10) v = v.slice(0, 10);
        input.value = v;
    });
}

function validarHoras() {
    const campo = document.getElementById('id_tempo_uso_diario');
    if (campo.value > 24) campo.value = 24;
    if (campo.value < 0)  campo.value = 0;
}

document.addEventListener('DOMContentLoaded', () => {
    ['data_troca', 'data_quebra'].forEach(id => {
        const campo = document.getElementById(id);
        if (campo) aplicarMascaraData(campo);
    });
});
</script>

</body>
</html>
